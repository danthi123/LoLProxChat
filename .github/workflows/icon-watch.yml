name: Icon watch (retrain on icon changes)

# Daily (and on demand): scrape the latest champion icons from Community Dragon.
# If the icon set changed — a new champion, skin, or rework — retrain the minimap
# tracking classifier, bump the patch version, and open a PR with the new model.
# A human validates tracking in a real game, then merges; the version bump landing
# on main then triggers release.yml to build a draft release.
#
# One-time repo setting required for the PR step:
#   Settings -> Actions -> General -> Workflow permissions ->
#     "Allow GitHub Actions to create and approve pull requests"  (enabled)
# Without it the branch is still pushed, but you must open the PR by hand.

on:
  schedule:
    - cron: '0 9 * * *' # daily 09:00 UTC (no-ops fast when icons are unchanged)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Scraper + orchestrator use only Node built-ins, so no `npm install` here.
      - name: Scrape latest icons (Community Dragon)
        run: npm run update-icons

      # What the scrape is compared against matters. Comparing against main
      # alone meant that once a refresh PR was open and unmerged, every daily
      # run saw the same "change" main was still missing, retrained, and
      # force-pushed the branch again — a "pushed 1 commit" notification a day
      # for as long as the PR sat there, and a new PR per game patch on top.
      # So the baseline is the newest open refresh PR's manifest when there is
      # one, and main's otherwise.
      - name: Find the open refresh PR, if any
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only this repo's own branches: on a public repo anyone can open a
          # PR from a fork with a branch of the same name.
          gh pr list --state open --json number,headRefName,createdAt,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("auto/icon-refresh-")))] | sort_by(.createdAt)' > open-prs.json
          cat open-prs.json
          LATEST=$(node -e "const p=require('./open-prs.json'); process.stdout.write(p.length ? p[p.length-1].headRefName : '')")
          echo "branch=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST" ]; then
            git fetch --depth=1 origin "$LATEST"
            git show "FETCH_HEAD:models/champion-icons-manifest.json" > baseline-manifest.json
            # The PR's version bump was computed from main as it was then. Once
            # main moves past it the PR conflicts (and resolving it carelessly
            # rolls the version back), so rebuild it even with no icon change.
            ver() { sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1; }
            PR_VER=$(git show "FETCH_HEAD:src-tauri/Cargo.toml" | ver)
            MAIN_VER=$(ver < src-tauri/Cargo.toml)
            NEWER=$(printf '%s\n%s\n' "$MAIN_VER" "$PR_VER" | sort -V | tail -1)
            if [ "$PR_VER" = "$MAIN_VER" ] || [ "$NEWER" != "$PR_VER" ]; then
              echo "stale=true" >> "$GITHUB_OUTPUT"
              echo "open PR is at $PR_VER, main is at $MAIN_VER - will rebuild it"
            fi
          else
            git show "HEAD:models/champion-icons-manifest.json" > baseline-manifest.json
          fi

      - name: Detect icon-set change
        id: diff
        env:
          STALE: ${{ steps.open.outputs.stale }}
        run: |
          # Trigger only when a champion or skin is ADDED/REMOVED — not on icon
          # byte-hash churn. Community Dragon periodically re-encodes the PNGs
          # (same pixels, different bytes), which would otherwise churn nearly
          # every hash and open a spurious retrain PR + release.
          if [ "$STALE" = "true" ] \
             || node scripts/icon-set-changed.mjs baseline-manifest.json models/champion-icons-manifest.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install training deps (CPU torch)
        if: steps.diff.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt

      - name: Retrain classifier
        if: steps.diff.outputs.changed == 'true'
        run: npm run train-model # --skip-scrape: icons are already fresh

      - name: Compose PR body
        if: steps.diff.outputs.changed == 'true'
        id: meta
        run: |
          node scripts/icon-diff-summary.mjs > pr-body.md
          echo "patch=$(node -e "process.stdout.write(require('./models/champion-icons-manifest.json').version)")" >> "$GITHUB_OUTPUT"
          echo "---- PR body ----"; cat pr-body.md

      - name: Bump version + changelog
        if: steps.diff.outputs.changed == 'true'
        id: bump
        env:
          PATCH: ${{ steps.meta.outputs.patch }}
        run: |
          APP=$(node scripts/bump-version.mjs --type patch \
            --changelog "### Changed\n- Champion classifier retrained on the current-patch Community Dragon icon set (game patch ${PATCH}).")
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "App version bumped to $APP"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH: ${{ steps.meta.outputs.patch }}
          APP: ${{ steps.bump.outputs.app }}
        run: |
          BRANCH="auto/icon-refresh-${PATCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add models/champion_classifier.onnx models/champion_labels.json \
                  models/champion-icons-manifest.json models/champion-classifier-metrics.json \
                  src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git commit -m "feat: refresh champion classifier for game patch ${PATCH} (v${APP})"
          git push -f -u origin "$BRANCH"
          # Create the PR, or just update the body if one already exists for this branch.
          gh pr create --base main --head "$BRANCH" \
            --title "Refresh champion classifier — game patch ${PATCH} (v${APP})" \
            --body-file pr-body.md \
            || gh pr edit "$BRANCH" \
                 --title "Refresh champion classifier — game patch ${PATCH} (v${APP})" \
                 --body-file pr-body.md

      # One refresh PR at a time. Each retrains from scratch on the full icon
      # set, so a newer one contains everything an older one did; leaving the
      # older ones open is just a queue nobody will merge. Runs on every run,
      # not only after a retrain, so a backlog is cleared on the next run.
      - name: Close superseded refresh PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          PATCH: ${{ steps.meta.outputs.patch }}
          LATEST: ${{ steps.open.outputs.branch }}
        run: |
          if [ "$CHANGED" = "true" ]; then KEEP="auto/icon-refresh-${PATCH}"; else KEEP="$LATEST"; fi
          [ -n "$KEEP" ] || { echo "no refresh PR to keep; nothing to close"; exit 0; }
          NEW=$(gh pr view "$KEEP" --json number --jq .number)
          for OLD in $(node -e "for (const p of require('./open-prs.json')) if (p.headRefName !== process.argv[1]) console.log(p.number)" "$KEEP"); do
            gh pr close "$OLD" --delete-branch --comment "Superseded by #${NEW}, which retrains on the full current icon set."
          done
